<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Echo trusted-click detector</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; }
    #target { width: 220px; height: 48px; font-size: 16px; }
    #log { margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Trusted click</h1>
  <p>A real Chrome pointer click sets <code>event.isTrusted === true</code>. JS <code>el.click()</code> does not.</p>
  <button id="target" type="button">Click me</button>
  <input id="name" placeholder="type here">
  <div id="log"></div>
  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('target');
    window.__echo = { trusted: null, webdriver: navigator.webdriver === true, clicks: 0 };
    btn.addEventListener('click', (e) => {
      window.__echo.trusted = e.isTrusted;
      window.__echo.clicks += 1;
      log.textContent = 'isTrusted=' + e.isTrusted + ' clicks=' + window.__echo.clicks + ' webdriver=' + window.__echo.webdriver;
    });
    document.getElementById('name').addEventListener('input', (e) => {
      window.__echo.value = e.target.value;
    });
  </script>
</body>
</html>
